# lakeleto CI — runs on the PUBLIC mirror (lucheeseng827/lakeleto).
#
# Synced from the private monorepo to `.github/workflows/ci.yml` (see .ossync.yaml), as
# release.yml is. Every change to Lakeleto that merges upstream is synced to this repository's
# main, so a push to main here is the build and test of that change; a pull request here is
# checked the same way before it is backported.
#
#   rust               fmt; clippy and tests on the default build, on the release feature set plus
#                      `flight`, and on the database drivers without `sql`; the Flight SQL server
#                      under Python's ADBC driver (pinned).
#   frontend-dist-gate the committed SPA bundle (frontend/dist, embedded by rust-embed) must match
#                      a fresh `npm ci && npm run build` of frontend/src.
#
# The release feature set is read from release.yml's `FEATURES`, the set the binaries, the image
# and the installers are built with, so what is tested here cannot drift from what ships.
#
# Cargo.lock is the one the sync resolves for this standalone workspace; every cargo command
# here runs with --locked, so a change that needs a different graph says so instead of drifting.

name: ci

on:
  push:
    branches: [main]
    # The release's brew job commits the formula to main: nothing in it is built or tested.
    paths-ignore:
      - "Formula/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Line tables only, as the upstream workspace builds dev and test: full debug info makes every
  # test binary of the release set several times larger and its link slower, on a runner whose
  # disk this job already has to reclaim. (The published Cargo.toml carries [profile.release]
  # only, so this is set here rather than inherited.)
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a pull request replaces its older run; a run on main always finishes, so each
  # synced change has a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Reclaim runner disk (every test binary links the whole feature set)
        run: |
          set -euo pipefail
          # Each integration test of the release set is its own binary statically linking
          # DataFusion, the Iceberg reader and the object-store clients, with debug info; together
          # they outgrow a stock runner's disk, and ld then dies with SIGBUS mid-link. Drop the
          # large preinstalled toolchains this job never touches.
          before=$(df -Pk / | awk 'NR==2{print $4}')
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/graalvm /usr/local/share/powershell || true
          after=$(df -Pk / | awk 'NR==2{print $4}')
          echo "Reclaimed $(( (after - before) / 1024 )) MiB; free now:"; df -h /

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy (default build — the lean one users get)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Release feature set (release.yml's FEATURES)
        id: release
        run: |
          set -euo pipefail
          # Exactly one `  FEATURES: a,b,c` line in release.yml's top-level env block. Assigned
          # first: inside `echo "…$(…)"` a failure would be lost, and the steps below would build
          # the default set with every check green.
          features="$(sed -nE 's/^  FEATURES:[ \t]*"?([A-Za-z0-9_,-]+)"?[ \t]*(#.*)?$/\1/p' .github/workflows/release.yml)"
          test -n "$features"
          test "$(printf '%s\n' "$features" | wc -l)" -eq 1
          echo "features=$features" >> "$GITHUB_OUTPUT"

      - name: Clippy (release feature set + flight)
        env:
          FEATURES: ${{ steps.release.outputs.features }}
        run: cargo clippy --locked --features "$FEATURES,flight" --all-targets -- -D warnings

      - name: Test (default build)
        run: cargo test --locked

      - name: Test (release feature set + flight)
        env:
          FEATURES: ${{ steps.release.outputs.features }}
        run: cargo test --locked --features "$FEATURES,flight"

      # The Flight SQL server under Python's ADBC driver, as a notebook reaches it. The binary is
      # built by name, with `flight`, right before it runs, so the smoke never depends on what
      # another step left in target/debug. The driver is pinned (ops/flight_adbc_requirements.txt):
      # a red run here is a change in Lakeleto, not a new driver.
      - name: Build lakeleto with flight
        env:
          FEATURES: ${{ steps.release.outputs.features }}
        run: cargo build --locked --bin lakeleto --features "$FEATURES,flight"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Flight SQL through ADBC (pinned driver)
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/adbc"
          "$RUNNER_TEMP/adbc/bin/pip" install --quiet -r ops/flight_adbc_requirements.txt
          "$RUNNER_TEMP/adbc/bin/python" ops/flight_adbc_smoke.py target/debug/lakeleto

      # The database engine without `sql`: its own SQL, and MCP's `query` offered on it alone,
      # with no DataFusion in the build. `object-store` is here too, so it is also built and tested
      # without `sql`, whose code paths it otherwise only meets in the release set.
      - name: Clippy (database drivers + object-store)
        run: |
          set -euo pipefail
          cargo clippy --locked \
            --features serve,object-store,sqlite,postgres,mysql,mcp \
            --all-targets -- -D warnings

      - name: Test (database drivers + object-store)
        run: cargo test --locked --features serve,object-store,sqlite,postgres,mysql,mcp

  frontend-dist-gate:
    # Rebuild the committed bundle and fail on any difference. A byte-level diff is a valid gate
    # only while the build is byte-reproducible on the Node major pinned below; if that stops
    # holding, relax it to a parse-level diff rather than drop it: a stale bundle is the binary
    # serving a UI that does not match its source.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (locked)
        run: npm ci

      # `npm run build` is `tsc -b && vite build`, so a type error fails here first.
      - name: Build the SPA
        run: npm run build

      - name: The committed bundle must match a fresh build
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if ! git diff --quiet -- frontend/dist; then
            echo "::error::frontend/dist is stale — it does not match a fresh build of frontend/src."
            echo "Fix: cd frontend && npm ci && npm run build, then commit frontend/dist."
            git --no-pager diff --stat -- frontend/dist
            exit 1
          fi
          echo "frontend/dist matches a fresh build."
