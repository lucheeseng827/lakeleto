<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Lakeleto">
  <title>Lakeleto</title>
  <defs>
    <filter id="fibre" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
    </filter>
    <clipPath id="sheet"><rect x="30" y="30" width="196" height="196"/></clipPath>
  </defs>

  <!-- Keyblock: printed first, never moves -->
  <rect x="16" y="16" width="224" height="224" fill="#14161a"/>
  <!-- The reserved sheet -->
  <rect x="30" y="30" width="196" height="196" fill="#f2e6ce"/>

  <!-- Strata as registered pigment blocks, each a flat sealed field -->
  <rect x="58" y="58" width="140" height="24" fill="#14161a"/>
  <rect x="58" y="102" width="90"  height="24" fill="#1e3a5f"/>
  <rect x="58" y="146" width="119" height="24" fill="#d14a3a"/>
  <rect x="58" y="190" width="57"  height="24" fill="#5a3e2b"/>

  <!-- Kento registration marks: where each block is nudged true -->
  <g fill="#d14a3a">
    <rect x="30" y="30" width="18" height="3"/><rect x="30" y="30" width="3" height="18"/>
    <rect x="208" y="223" width="18" height="3"/><rect x="223" y="208" width="3" height="18"/>
  </g>

  <!-- Paper fibre, generated not fetched -->
  <rect x="30" y="30" width="196" height="196" filter="url(#fibre)" clip-path="url(#sheet)" opacity="0.5"/>
</svg>
